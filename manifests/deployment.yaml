apiVersion: apps/v1
kind: Deployment
metadata:
  name: saif-html-app
  namespace: default
  labels:
    app: saif-html-app
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saif-html-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: saif-html-app
        version: v1
    spec:
      containers:
      - name: saif-html-app
        image: youracr.azurecr.io/saif-html-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
      
      # ACR থেকে image pull করার জন্য secret
      imagePullSecrets:
      - name: acr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: saif-html-app-service
  namespace: default
  labels:
    app: saif-html-app
spec:
  type: LoadBalancer
  selector:
    app: saif-html-app
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
